<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080d">

<title>VANGUARD ZERO</title>

<style>
:root{
 --safeT:max(12px,env(safe-area-inset-top));
 --safeB:max(12px,env(safe-area-inset-bottom));
 --safeL:max(12px,env(safe-area-inset-left));
 --safeR:max(12px,env(safe-area-inset-right));
 --cyan:#5de4ff;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#05080d;color:white;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 touch-action:none;overscroll-behavior:none
}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hidden{display:none!important}

.screen{
 position:fixed;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;
 background:
 radial-gradient(circle at 80% 20%,#15435855,transparent 35%),
 linear-gradient(130deg,#05080df4,#0b1922eb);
 backdrop-filter:blur(13px)
}
.card{
 width:min(650px,92vw);max-height:90vh;overflow:auto;
 padding:25px;border:1px solid #ffffff24;border-radius:24px;
 background:#071018de;box-shadow:0 30px 100px #000b
}
.logo{font-size:clamp(42px,9vw,77px);font-weight:950;letter-spacing:-4px;line-height:.8}
.logo span{display:block;color:var(--cyan);font-size:.42em;letter-spacing:8px;margin-top:15px}
.subtitle{color:#a8bcc8;line-height:1.5}

button,select,input{font:inherit}
.big{
 display:block;width:100%;padding:15px;margin:8px 0;
 border:0;border-radius:13px;font-weight:900;
 background:#eaf8fb;color:#08131a
}
.dark{background:#15232d;color:white;border:1px solid #ffffff20}

#modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.mode{
 min-height:95px;padding:13px;text-align:left;color:#fff;
 border:1px solid #ffffff20;border-radius:15px;
 background:#ffffff08
}
.mode b{display:block;font-size:18px;margin-bottom:4px}
.mode small{color:#9fb0bb}
.mode.selected{border-color:var(--cyan);background:#5de4ff18}

label{display:block;margin-top:13px;color:#c7d5dd;font-size:13px}
select{width:100%;margin-top:5px;padding:12px;background:#111e27;color:#fff;border:1px solid #ffffff25;border-radius:10px}
input[type=range]{width:100%}

/* HUD */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#score{
 position:absolute;top:var(--safeT);left:50%;transform:translateX(-50%);
 padding:7px 13px;background:#03070ba8;border:1px solid #ffffff1d;
 border-radius:9px;font-weight:800;font-size:13px
}
#fps{
 position:absolute;left:var(--safeL);top:var(--safeT);
 color:#bdefff;background:#02080bad;padding:6px 9px;border-radius:8px;font-size:11px
}
#killfeed{
 position:absolute;right:var(--safeR);top:65px;text-align:right;
 font-size:11px;text-shadow:0 2px 4px #000
}
.feed{margin:3px 0}
#stats{
 position:absolute;left:var(--safeL);bottom:calc(var(--safeB) + 170px);
 font-size:12px;text-shadow:0 2px 5px #000
}
.statbar{width:150px;height:7px;background:#0009;border-radius:8px;overflow:hidden;margin:4px 0}
#hp{height:100%;width:100%;background:#ef5b55}
#armor{height:100%;width:50%;background:#4dcbf1}

#weapon{
 position:absolute;right:var(--safeR);bottom:calc(var(--safeB) + 165px);
 text-align:right;text-shadow:0 2px 7px #000
}
#weaponName{font-size:12px;color:#b9cad4}
#ammo{font-weight:950;font-size:30px}

#crosshair{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%)}
.line{position:absolute;background:#fff;box-shadow:0 0 3px #000}
.l1{left:13px;top:0;width:2px;height:8px}.l2{left:13px;bottom:0;width:2px;height:8px}
.l3{top:13px;left:0;height:2px;width:8px}.l4{top:13px;right:0;height:2px;width:8px}
#hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);font-size:32px;opacity:0}
#damage{position:absolute;inset:0;background:#d514142d;opacity:0}

#pauseBtn{
 pointer-events:auto;position:absolute;right:var(--safeR);top:var(--safeT);
 width:43px;height:43px;border-radius:10px;
 border:1px solid #ffffff3d;background:#071018b9;color:#fff;font-size:19px
}

/* TOUCH */
#look{pointer-events:auto;position:absolute;left:40%;right:0;top:55px;bottom:80px}
#joyZone{pointer-events:auto;position:absolute;left:var(--safeL);bottom:var(--safeB);width:170px;height:170px}
#joyBase{position:absolute;left:25px;top:25px;width:115px;height:115px;border:2px solid #ffffff2e;background:#ffffff0d;border-radius:50%}
#joy{position:absolute;left:50%;top:50%;width:55px;height:55px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff3d;border:2px solid #ffffff6b}

.control{
 pointer-events:auto;position:absolute;border-radius:50%;
 width:64px;height:64px;border:1px solid #ffffff4b;
 background:#071018b9;color:#fff;font-weight:900;font-size:9px;
 backdrop-filter:blur(5px)
}
#fire{right:var(--safeR);bottom:var(--safeB);width:75px;height:75px;background:#e8484855}
#ads{right:calc(var(--safeR) + 84px);bottom:var(--safeB)}
#reload{right:var(--safeR);bottom:calc(var(--safeB) + 84px)}
#jump{right:calc(var(--safeR) + 79px);bottom:calc(var(--safeB) + 76px)}
#swap{right:calc(var(--safeR) + 150px);bottom:calc(var(--safeB) + 8px);width:55px;height:55px}

#zone{
 position:absolute;left:50%;top:75px;transform:translateX(-50%);
 color:#71ddff;font-weight:800;font-size:12px
}
#centerMessage{
 position:absolute;left:50%;top:35%;transform:translateX(-50%);
 font-size:24px;font-weight:950;text-shadow:0 3px 8px #000;
 opacity:0;text-align:center
}
</style>
</head>

<body>

<div id="menu" class="screen">
<div class="card">
 <div class="logo">VANGUARD<span>ZERO</span></div>
 <p class="subtitle">High-speed mobile combat. Original arenas, AI combatants and four game modes designed for Safari.</p>

 <div id="modes">
  <button class="mode selected" data-mode="ffa"><b>FREE FOR ALL</b><small>First to 20 eliminations.</small></button>
  <button class="mode" data-mode="gun"><b>GUN GAME</b><small>Advance weapons every elimination.</small></button>
  <button class="mode" data-mode="br"><b>BATTLE ROYALE</b><small>One life. Survive the closing zone.</small></button>
  <button class="mode" data-mode="reload"><b>RELOAD</b><small>Limited-ammo elimination rounds.</small></button>
 </div>

 <button id="deploy" class="big">DEPLOY</button>
 <button id="menuSettings" class="big dark">SETTINGS</button>
 <p style="font-size:11px;color:#78909d">Combatants marked AI are computer-controlled. No online multiplayer connection is implied.</p>
</div>
</div>

<div id="settings" class="screen hidden">
<div class="card">
 <h2>SETTINGS</h2>

 <label>Graphics</label>
 <select id="quality">
  <option value="performance">Performance</option>
  <option value="high" selected>High</option>
  <option value="ultra">Ultra</option>
 </select>

 <label>Look sensitivity</label>
 <input id="sens" type="range" min="2" max="12" value="6">

 <label>Field of View</label>
 <input id="fov" type="range" min="65" max="95" value="78">

 <label>AI Combatants</label>
 <input id="botCount" type="range" min="6" max="24" value="14">

 <button id="closeSettings" class="big">APPLY</button>
</div>
</div>

<div id="pause" class="screen hidden">
<div class="card">
 <h2>PAUSED</h2>
 <button id="resume" class="big">RESUME</button>
 <button id="pauseSettings" class="big dark">SETTINGS</button>
 <button id="quit" class="big dark">LEAVE MATCH</button>
</div>
</div>

<div id="hud" class="hidden">
 <div id="damage"></div>
 <div id="fps">60 FPS</div>
 <div id="score"></div>
 <div id="zone"></div>
 <div id="killfeed"></div>

 <div id="stats">
  <b>HEALTH</b>
  <div class="statbar"><div id="hp"></div></div>
  <b>ARMOR</b>
  <div class="statbar"><div id="armor"></div></div>
 </div>

 <div id="weapon">
  <div id="weaponName"></div>
  <div id="ammo"></div>
 </div>

 <div id="crosshair">
  <i class="line l1"></i><i class="line l2"></i>
  <i class="line l3"></i><i class="line l4"></i>
 </div>
 <div id="hitmarker">×</div>
 <div id="centerMessage"></div>

 <button id="pauseBtn">☰</button>
 <div id="look"></div>
 <div id="joyZone"><div id="joyBase"><div id="joy"></div></div></div>

 <button class="control" id="fire">FIRE</button>
 <button class="control" id="ads">ADS</button>
 <button class="control" id="reload">RELOAD</button>
 <button class="control" id="jump">JUMP</button>
 <button class="control" id="swap">SWAP</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}

<script type="module">
import * as THREE from "three";

const $=s=>document.querySelector(s);

/* -------------------- THREE -------------------- */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8098a3);
scene.fog=new THREE.Fog(0x8098a3,35,125);

const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.05,180);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.prepend(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xcdeaff,0x293026,1.5);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffe7bd,3.4);
sun.position.set(-45,70,35);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-60;
sun.shadow.camera.right=60;
sun.shadow.camera.top=60;
sun.shadow.camera.bottom=-60;
sun.shadow.camera.far=160;
scene.add(sun);

/* -------------------- ARENA -------------------- */

const world=new THREE.Group();
scene.add(world);

const concrete=new THREE.MeshStandardMaterial({
 color:0x636b6c,roughness:.83
});
const darkMetal=new THREE.MeshStandardMaterial({
 color:0x20292d,roughness:.5,metalness:.45
});
const grass=new THREE.MeshStandardMaterial({
 color:0x526c43,roughness:.95
});
const accent=new THREE.MeshStandardMaterial({
 color:0x163742,roughness:.6,metalness:.2
});

function box(x,y,z,w,h,d,mat=concrete){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 world.add(m);
 return m;
}

box(0,-1,0,120,2,120,grass);

/* central combat complex */
box(0,2,-12,25,4,4);
box(0,2,12,25,4,4);
box(-12,2,0,4,4,20);
box(12,2,0,4,4,20);

box(0,1.25,0,7,2.5,7,accent);

/* cover */
[
 [-24,0,-20],[24,0,20],[-23,0,18],[22,0,-18],
 [-7,0,-28],[7,0,29],[-31,0,2],[31,0,-3],
 [-15,0,26],[17,0,-26]
].forEach(([x,y,z],i)=>{
 box(x,1,z,i%2?6:4,2,i%2?2:5,darkMetal);
});

/* perimeter buildings */
box(-43,5,-20,12,10,24);
box(43,4,19,14,8,22);
box(-35,3,34,22,6,10);
box(34,4,-35,20,8,10);

const obstacles=world.children;

/* -------------------- PLAYER -------------------- */

const player={
 pos:new THREE.Vector3(0,1.7,30),
 yaw:0,
 pitch:0,
 velocity:new THREE.Vector3(),
 health:100,
 armor:50,
 kills:0,
 deaths:0,
 grounded:true,
 alive:true
};

camera.position.copy(player.pos);

/* -------------------- WEAPONS -------------------- */

const weapons=[
 {
  name:"VX-9 CARBINE",
  damage:24,
  head:1.65,
  mag:30,
  reserve:120,
  rate:.095,
  spread:.009,
  recoil:.017,
  reload:1.65,
  range:95
 },
 {
  name:"R-12 SMG",
  damage:17,
  head:1.45,
  mag:36,
  reserve:144,
  rate:.065,
  spread:.017,
  recoil:.012,
  reload:1.4,
  range:60
 },
 {
  name:"M7 MARKSMAN",
  damage:52,
  head:1.8,
  mag:12,
  reserve:48,
  rate:.3,
  spread:.004,
  recoil:.035,
  reload:1.9,
  range:130
 },
 {
  name:"K-4 SIDEARM",
  damage:31,
  head:1.75,
  mag:15,
  reserve:60,
  rate:.19,
  spread:.012,
  recoil:.02,
  reload:1.25,
  range:70
 }
];

let weaponIndex=0;
let ammo=weapons[0].mag;
let reserve=weapons[0].reserve;
let lastShot=0;
let reloading=false;
let ads=false;

function equip(i){
 weaponIndex=(i+weapons.length)%weapons.length;
 ammo=weapons[weaponIndex].mag;
 reserve=weapons[weaponIndex].reserve;
 reloading=false;
 updateWeapon();
}

function updateWeapon(){
 const w=weapons[weaponIndex];
 $("#weaponName").textContent=w.name+(reloading?" · RELOADING":"");
 $("#ammo").textContent=`${ammo} / ${reserve}`;
}

/* -------------------- WEAPON MODEL -------------------- */

const gun=new THREE.Group();
camera.add(gun);
scene.add(camera);

const gunMat=new THREE.MeshStandardMaterial({
 color:0x1d2428,metalness:.6,roughness:.35
});
const gunAccent=new THREE.MeshStandardMaterial({
 color:0x59646a,metalness:.72,roughness:.28
});

const receiver=new THREE.Mesh(
 new THREE.BoxGeometry(.12,.13,.65),gunMat
);
receiver.position.set(.18,-.18,-.52);
gun.add(receiver);

const barrel=new THREE.Mesh(
 new THREE.BoxGeometry(.055,.055,.43),gunAccent
);
barrel.position.set(.18,-.15,-1);
gun.add(barrel);

/* -------------------- BOTS -------------------- */

const bots=[];
const botBodyGeo=new THREE.CapsuleGeometry(.32,.85,3,7);
const botHeadGeo=new THREE.SphereGeometry(.25,10,8);

const botColors=[
 0x314754,0x594534,0x403d54,0x2d503f,
 0x5a3537,0x4d5053
];

function spawnPoint(){
 const a=Math.random()*Math.PI*2;
 const r=22+Math.random()*30;
 return new THREE.Vector3(
  Math.cos(a)*r,
  .75,
  Math.sin(a)*r
 );
}

function makeBot(i){
 const root=new THREE.Group();

 const mat=new THREE.MeshStandardMaterial({
  color:botColors[i%botColors.length],
  roughness:.68,
  metalness:.12
 });

 const body=new THREE.Mesh(botBodyGeo,mat);
 body.position.y=.83;
 body.castShadow=true;

 const head=new THREE.Mesh(botHeadGeo,new THREE.MeshStandardMaterial({
  color:0xb38d72,roughness:.8
 }));
 head.position.y=1.68;
 head.castShadow=true;

 root.add(body,head);

 const p=spawnPoint();
 root.position.copy(p);

 root.userData={
  name:`AI-${String(i+1).padStart(2,"0")}`,
  health:100,
  alive:true,
  kills:0,
  target:null,
  think:Math.random(),
  shoot:Math.random(),
  wander:Math.random()*Math.PI*2,
  reaction:.35+Math.random()*.55,
  accuracy:.45+Math.random()*.35,
  strafe:Math.random()>.5?1:-1,
  head
 };

 scene.add(root);
 bots.push(root);
 return root;
}

function createBots(){
 bots.forEach(b=>scene.remove(b));
 bots.length=0;

 const count=Number($("#botCount").value);

 for(let i=0;i<count;i++)
  makeBot(i);
}

/* -------------------- RAY / SHOOTING -------------------- */

const raycaster=new THREE.Raycaster();

function tracer(from,to,color=0xffdd8d){
 const geometry=new THREE.BufferGeometry().setFromPoints([from,to]);
 const line=new THREE.Line(
  geometry,
  new THREE.LineBasicMaterial({
   color,
   transparent:true,
   opacity:.8
  })
 );

 scene.add(line);

 setTimeout(()=>{
  scene.remove(line);
  geometry.dispose();
  line.material.dispose();
 },45);
}

function hitMarker(){
 const e=$("#hitmarker");
 e.style.opacity=1;
 setTimeout(()=>e.style.opacity=0,80);
}

function shoot(){
 if(!player.alive||reloading||paused)return;

 const now=performance.now()/1000;
 const w=weapons[weaponIndex];

 if(now-lastShot<w.rate)return;

 if(ammo<=0){
  reload();
  return;
 }

 lastShot=now;
 ammo--;

 let spread=ads?w.spread*.38:w.spread;

 const direction=new THREE.Vector3(
  (Math.random()-.5)*spread,
  (Math.random()-.5)*spread,
  -1
 );

 direction.unproject(camera)
   .sub(camera.position)
   .normalize();

 raycaster.set(camera.position,direction);
 raycaster.far=w.range;

 const targets=[];

 bots.forEach(b=>{
  if(b.userData.alive)
   targets.push(...b.children);
 });

 targets.push(...obstacles);

 const hits=raycaster.intersectObjects(targets,false);
 const end=camera.position.clone().addScaledVector(direction,w.range);

 if(hits.length){
  const hit=hits[0];
  end.copy(hit.point);

  const bot=bots.find(b=>b.children.includes(hit.object));

  if(bot){
   const isHead=hit.object===bot.userData.head;
   const dmg=w.damage*(isHead?w.head:1);

   bot.userData.health-=dmg;
   hitMarker();

   if(bot.userData.health<=0)
    eliminateBot(bot,"YOU");
  }
 }

 tracer(camera.position.clone(),end);

 player.pitch+=w.recoil*(ads?.55:1);
 updateWeapon();
}

function reload(){
 if(reloading)return;

 const w=weapons[weaponIndex];

 if(ammo>=w.mag||reserve<=0)return;

 reloading=true;
 updateWeapon();

 setTimeout(()=>{
  if(!reloading)return;

  const need=w.mag-ammo;
  const amount=Math.min(need,reserve);

  ammo+=amount;
  reserve-=amount;

  reloading=false;
  updateWeapon();
 },w.reload*1000);
}

/* -------------------- DAMAGE -------------------- */

function damagePlayer(amount,attacker){
 if(!player.alive)return;

 const armorAbsorb=Math.min(player.armor,amount*.55);

 player.armor-=armorAbsorb;
 player.health-=amount-armorAbsorb;

 $("#damage").style.opacity=.8;

 setTimeout(()=>{
  $("#damage").style.opacity=0;
 },90);

 if(player.health<=0)
  killPlayer(attacker);
}

function killPlayer(attacker){
 player.alive=false;
 player.deaths++;

 feed(`${attacker} eliminated YOU`);

 if(gameMode==="br"||gameMode==="reload"){
  center("ELIMINATED");
  setTimeout(endMatch,1800);
  return;
 }

 setTimeout(respawnPlayer,1400);
}

function respawnPlayer(){
 const p=spawnPoint();

 player.pos.copy(p);
 player.pos.y=1.7;
 player.health=100;
 player.armor=50;
 player.alive=true;

 equip(gameMode==="gun"?Math.min(
  weapons.length-1,
  Math.floor(player.kills/2)
 ):weaponIndex);
}

function eliminateBot(bot,killer){
 if(!bot.userData.alive)return;

 bot.userData.alive=false;
 bot.visible=false;

 if(killer==="YOU"){
  player.kills++;
  feed(`YOU eliminated ${bot.userData.name}`);

  if(gameMode==="gun"){
   weaponIndex=Math.min(
    weapons.length-1,
    Math.floor(player.kills/2)
   );
   equip(weaponIndex);
  }

  if(gameMode==="ffa"&&player.kills>=20){
   center("VICTORY");
   setTimeout(endMatch,2000);
   return;
  }
 }

 if(gameMode!=="br"&&gameMode!=="reload"){
  setTimeout(()=>{
   bot.position.copy(spawnPoint());
   bot.userData.health=100;
   bot.userData.alive=true;
   bot.visible=true;
  },1600+Math.random()*1700);
 }
}

/* -------------------- AI -------------------- */

function nearestTarget(bot){
 let targetPlayer=null;
 let distance=Infinity;

 if(player.alive){
  const d=bot.position.distanceTo(player.pos);

  if(d<distance){
   distance=d;
   targetPlayer="player";
  }
 }

 bots.forEach(other=>{
  if(other===bot||!other.userData.alive)return;

  const d=bot.position.distanceTo(other.position);

  if(d<distance){
   distance=d;
   targetPlayer=other;
  }
 });

 return {target:targetPlayer,distance};
}

function updateBots(dt,time){
 for(const bot of bots){
  if(!bot.userData.alive)continue;

  const data=bot.userData;

  data.think-=dt;

  if(data.think<=0){
   const found=nearestTarget(bot);
   data.target=found.target;
   data.think=.3+Math.random()*.4;

   if(Math.random()<.18)
    data.strafe*=-1;
  }

  let targetPos=null;

  if(data.target==="player"&&player.alive)
   targetPos=player.pos;
  else if(data.target?.userData?.alive)
   targetPos=data.target.position;

  if(!targetPos){
   data.wander+=dt*.5;

   bot.position.x+=Math.sin(data.wander)*dt;
   bot.position.z+=Math.cos(data.wander)*dt;
   continue;
  }

  const dx=targetPos.x-bot.position.x;
  const dz=targetPos.z-bot.position.z;
  const dist=Math.max(.01,Math.hypot(dx,dz));

  bot.rotation.y=Math.atan2(dx,dz);

  const nx=dx/dist;
  const nz=dz/dist;

  /* approach, strafe, retreat */
  let forward=dist>10?1:dist<5?-.65:.05;

  bot.position.x+=(nx*forward+nz*data.strafe*.45)*2.15*dt;
  bot.position.z+=(nz*forward-nx*data.strafe*.45)*2.15*dt;

  bot.position.x=THREE.MathUtils.clamp(bot.position.x,-55,55);
  bot.position.z=THREE.MathUtils.clamp(bot.position.z,-55,55);

  data.shoot-=dt;

  if(dist<42&&data.shoot<=0){
   data.shoot=.22+Math.random()*.38;

   const origin=bot.position.clone();
   origin.y+=1.35;

   const destination=targetPos.clone();
   destination.y+=data.target==="player"?1.1:.9;

   /* AI aim error */
   const error=(1-data.accuracy)*dist*.035;
   destination.x+=(Math.random()-.5)*error;
   destination.y+=(Math.random()-.5)*error;
   destination.z+=(Math.random()-.5)*error;

   tracer(origin,destination,0xff8e66);

   if(Math.random()<data.accuracy*Math.max(.2,1-dist/70)){
    if(data.target==="player"){
     damagePlayer(7+Math.random()*8,data.name);
    }else if(data.target?.userData){
     data.target.userData.health-=10+Math.random()*8;

     if(data.target.userData.health<=0){
      feed(`${data.name} eliminated ${data.target.userData.name}`);
      eliminateBot(data.target,data.name);
     }
    }
   }
  }
 }
}

/* -------------------- BR ZONE -------------------- */

let zoneRadius=55;
let zoneMesh;

function createZone(){
 if(zoneMesh)scene.remove(zoneMesh);

 const geo=new THREE.RingGeometry(.985,1,96);
 const mat=new THREE.MeshBasicMaterial({
  color:0x38bfe8,
  transparent:true,
  opacity:.24,
  side:THREE.DoubleSide
 });

 zoneMesh=new THREE.Mesh(geo,mat);
 zoneMesh.rotation.x=-Math.PI/2;
 zoneMesh.position.y=.04;
 scene.add(zoneMesh);
}

function updateZone(dt){
 if(gameMode!=="br"){
  $("#zone").textContent="";
  if(zoneMesh)zoneMesh.visible=false;
  return;
 }

 zoneMesh.visible=true;
 zoneRadius=Math.max(8,zoneRadius-dt*.16);
 zoneMesh.scale.set(zoneRadius,zoneRadius,zoneRadius);

 $("#zone").textContent=`ZONE ${Math.round(zoneRadius)}m`;

 if(Math.hypot(player.pos.x,player.pos.z)>zoneRadius)
  damagePlayer(7*dt,"THE ZONE");

 bots.forEach(b=>{
  if(
   b.userData.alive &&
   Math.hypot(b.position.x,b.position.z)>zoneRadius
  ){
   b.userData.health-=7*dt;

   if(b.userData.health<=0){
    feed(`ZONE eliminated ${b.userData.name}`);
    eliminateBot(b,"ZONE");
   }
  }
 });

 const remaining=
  bots.filter(b=>b.userData.alive).length+
  (player.alive?1:0);

 if(remaining===1&&player.alive){
  center("BATTLE ROYALE VICTORY");
  setTimeout(endMatch,2200);
 }
}

/* -------------------- CONTROLS -------------------- */

let joyX=0,joyY=0;
let joyID=null;

const joyZone=$("#joyZone");
const joy=$("#joy");

function joyMove(x,y){
 const r=joyZone.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let dx=x-cx;
 let dy=y-cy;

 const limit=47;
 const len=Math.hypot(dx,dy);

 if(len>limit){
  dx=dx/len*limit;
  dy=dy/len*limit;
 }

 joyX=dx/limit;
 joyY=dy/limit;

 joy.style.transform=
  `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}

joyZone.onpointerdown=e=>{
 joyID=e.pointerId;
 joyZone.setPointerCapture(e.pointerId);
 joyMove(e.clientX,e.clientY);
};

joyZone.onpointermove=e=>{
 if(e.pointerId===joyID)
  joyMove(e.clientX,e.clientY);
};

joyZone.onpointerup=
joyZone.onpointercancel=e=>{
 if(e.pointerId!==joyID)return;

 joyID=null;
 joyX=joyY=0;
 joy.style.transform="translate(-50%,-50%)";
};

let lookID=null;
let lastX=0,lastY=0;

$("#look").onpointerdown=e=>{
 lookID=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 $("#look").setPointerCapture(e.pointerId);
};

$("#look").onpointermove=e=>{
 if(e.pointerId!==lookID)return;

 const sensitivity=Number($("#sens").value)*.00075;

 player.yaw-=(e.clientX-lastX)*sensitivity*(ads?.55:1);
 player.pitch-=(e.clientY-lastY)*sensitivity*(ads?.55:1);

 player.pitch=THREE.MathUtils.clamp(
  player.pitch,-1.35,1.35
 );

 lastX=e.clientX;
 lastY=e.clientY;
};

$("#look").onpointerup=
$("#look").onpointercancel=e=>{
 if(e.pointerId===lookID)
  lookID=null;
};

const keys={};

addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(e.code==="KeyR")reload();
 if(e.code==="KeyQ")equip(weaponIndex+1);
});

addEventListener("keyup",e=>keys[e.code]=false);

/* continuous fire */

let fireHeld=false;

$("#fire").onpointerdown=e=>{
 e.preventDefault();
 fireHeld=true;
 shoot();
};

$("#fire").onpointerup=
$("#fire").onpointercancel=()=>{
 fireHeld=false;
};

$("#reload").onpointerdown=reload;
$("#swap").onpointerdown=()=>equip(weaponIndex+1);

$("#ads").onpointerdown=()=>ads=true;
$("#ads").onpointerup=
$("#ads").onpointercancel=()=>ads=false;

/* -------------------- MATCH -------------------- */

let gameMode="ffa";
let playing=false;
let paused=true;

document.querySelectorAll(".mode").forEach(button=>{
 button.onclick=()=>{
  document.querySelectorAll(".mode").forEach(b=>
   b.classList.remove("selected")
  );

  button.classList.add("selected");
  gameMode=button.dataset.mode;
 };
});

function startMatch(){
 player.kills=0;
 player.deaths=0;
 player.health=100;
 player.armor=50;
 player.alive=true;

 zoneRadius=55;

 createBots();
 createZone();

 if(gameMode==="gun")
  equip(0);
 else
  equip(0);

 $("#menu").classList.add("hidden");
 $("#hud").classList.remove("hidden");

 playing=true;
 paused=false;

 respawnPlayer();
 center(
  gameMode==="ffa"?"FREE FOR ALL":
  gameMode==="gun"?"GUN GAME":
  gameMode==="br"?"BATTLE ROYALE":
  "RELOAD"
 );
}

function endMatch(){
 playing=false;
 paused=true;

 $("#hud").classList.add("hidden");
 $("#menu").classList.remove("hidden");
}

$("#deploy").onclick=startMatch;

$("#pauseBtn").onclick=()=>{
 paused=true;
 $("#pause").classList.remove("hidden");
};

$("#resume").onclick=()=>{
 paused=false;
 $("#pause").classList.add("hidden");
};

$("#quit").onclick=()=>{
 $("#pause").classList.add("hidden");
 endMatch();
};

$("#menuSettings").onclick=()=>{
 $("#settings").classList.remove("hidden");
};

$("#pauseSettings").onclick=()=>{
 $("#pause").classList.add("hidden");
 $("#settings").classList.remove("hidden");
};

$("#closeSettings").onclick=()=>{
 $("#settings").classList.add("hidden");

 camera.fov=Number($("#fov").value);
 camera.updateProjectionMatrix();

 applyQuality();

 if(playing)
  paused=false;
};

function applyQuality(){
 const q=$("#quality").value;

 if(q==="performance"){
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled=false;
  scene.fog.far=90;
 }
 else if(q==="high"){
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
  renderer.shadowMap.enabled=true;
  scene.fog.far=125;
 }
 else{
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
  renderer.shadowMap.enabled=true;
  scene.fog.far=145;
 }

 renderer.setSize(innerWidth,innerHeight,false);
}

/* -------------------- UI -------------------- */

let feedItems=[];

function feed(text){
 feedItems.unshift({
  text,
  expires:performance.now()+3500
 });

 feedItems=feedItems.slice(0,5);
}

function center(text){
 const e=$("#centerMessage");

 e.textContent=text;
 e.style.opacity=1;

 setTimeout(()=>{
  e.style.opacity=0;
 },1300);
}

function updateUI(){
 $("#hp").style.width=
  Math.max(0,player.health)+"%";

 $("#armor").style.width=
  Math.max(0,player.armor)+"%";

 $("#score").textContent=
  gameMode==="br"
   ? `${bots.filter(b=>b.userData.alive).length+(player.alive?1:0)} REMAIN`
   : `${player.kills} KILLS · ${player.deaths} DEATHS`;

 const now=performance.now();

 feedItems=feedItems.filter(f=>f.expires>now);

 $("#killfeed").innerHTML=
  feedItems.map(f=>
   `<div class="feed">${f.text}</div>`
  ).join("");

 updateWeapon();
}

/* -------------------- MOVEMENT -------------------- */

function updatePlayer(dt){
 if(!player.alive)return;

 let x=joyX;
 let y=joyY;

 if(keys.KeyA)x-=1;
 if(keys.KeyD)x+=1;
 if(keys.KeyW)y-=1;
 if(keys.KeyS)y+=1;

 const length=Math.hypot(x,y);

 if(length>1){
  x/=length;
  y/=length;
 }

 const forwardX=-Math.sin(player.yaw);
 const forwardZ=-Math.cos(player.yaw);

 const rightX=Math.cos(player.yaw);
 const rightZ=-Math.sin(player.yaw);

 const speed=ads?3.1:5.5;

 player.pos.x+=
  (forwardX*-y+rightX*x)*speed*dt;

 player.pos.z+=
  (forwardZ*-y+rightZ*x)*speed*dt;

 player.pos.x=THREE.MathUtils.clamp(
  player.pos.x,-56,56
 );

 player.pos.z=THREE.MathUtils.clamp(
  player.pos.z,-56,56
 );

 camera.position.copy(player.pos);

 camera.rotation.order="YXZ";
 camera.rotation.y=player.yaw;
 camera.rotation.x=player.pitch;

 const targetFov=ads?55:Number($("#fov").value);

 camera.fov=THREE.MathUtils.lerp(
  camera.fov,
  targetFov,
  Math.min(1,dt*12)
 );

 camera.updateProjectionMatrix();

 gun.position.x=THREE.MathUtils.lerp(
  gun.position.x,
  ads?-.18:0,
  Math.min(1,dt*11)
 );

 gun.position.y=
  Math.sin(performance.now()*.009)*
  ((Math.abs(x)+Math.abs(y))>.1?.007:0);

 if(fireHeld)shoot();
}

/* -------------------- LOOP -------------------- */

const clock=new THREE.Clock();

let frames=0;
let fpsTimer=0;

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(playing&&!paused){
  updatePlayer(dt);
  updateBots(dt,performance.now()/1000);
  updateZone(dt);
  updateUI();
 }

 frames++;
 fpsTimer+=dt;

 if(fpsTimer>.5){
  $("#fps").textContent=
   Math.round(frames/fpsTimer)+" FPS";

  frames=0;
  fpsTimer=0;
 }

 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight,false);
});

applyQuality();
updateWeapon();
</script>
</body>
</html>
